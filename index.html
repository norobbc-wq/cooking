<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطبخنا - اقتراح وجبة اليوم</title>
    <!-- استدعاء خط النسخ من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #e67e22;
            --secondary-color: #d35400;
            --bg-color: #fcf8f2;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --ai-color: #8e44ad;
            --edit-color: #2980b9;
            --whatsapp-color: #25D366;
            --danger-color: #c0392b;
        }

        body {
            font-family: 'Amiri', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            font-size: 19px;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        nav {
            display: flex;
            justify-content: center;
            background-color: var(--secondary-color);
            flex-wrap: wrap;
        }

        nav button {
            background: none;
            border: none;
            color: white;
            padding: 12px 20px;
            font-size: 1.05rem;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
        }

        nav button:hover, nav button.active {
            background-color: rgba(255, 255, 255, 0.2);
            font-weight: bold;
        }

        .container {
            max-width: 650px;
            margin: 20px auto;
            padding: 15px;
        }

        .page {
            display: none;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .page.active {
            display: block;
        }

        h2 {
            color: var(--secondary-color);
            border-bottom: 2px solid #f0e4d7;
            padding-bottom: 8px;
            margin-top: 0;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-family: inherit;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--secondary-color);
        }

        /* تنسيق الزر المعطل */
        .btn:disabled {
            background-color: #bdc3c7 !important;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-ai {
            background-color: var(--ai-color);
        }

        .btn-ai:hover:not(:disabled) {
            background-color: #732d91;
        }

        .btn-whatsapp {
            background-color: var(--whatsapp-color);
            font-weight: bold;
        }

        .btn-whatsapp:hover:not(:disabled) {
            background-color: #1eb854;
        }

        select, input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
        }

        ul {
            list-style-type: square;
            padding-right: 25px;
            line-height: 1.8;
        }

        .result-box {
            background-color: #fff8f0;
            border-right: 4px solid var(--primary-color);
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
        }

        .item-list {
            list-style: none;
            padding: 0;
        }

        .item-list li {
            background: #f9f9f9;
            margin: 10px 0;
            padding: 12px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #eee;
        }

        .action-btns {
            display: flex;
            gap: 5px;
        }

        .ai-config {
            background: #f4ecf7;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 50%;
            transform: translateX(50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            background-color: #2c3e50;
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 1rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: auto;
            text-align: center;
            min-width: 250px;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .modal-card p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            margin: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>مطبخنا 🍲</h1>
    </header>

    <nav>
        <button id="tab-suggest" class="active" onclick="switchPage('suggest')">اختيار أكلة</button>
        <button id="tab-display" onclick="switchPage('display')">الأكلات المسجلة</button>
        <button id="tab-add" onclick="switchPage('add')">إضافة أكلة جديدة</button>
    </nav>

    <div class="container">
        <!-- 1. صفحة اختيار الأكلة -->
        <div id="page-suggest" class="page active">
            <h2>ماذا نطبخ اليوم؟</h2>
            <button class="btn" onclick="getRandomRecipe()">🎲 اختيار أكلة عشوائياً</button>
            
            <div style="margin-top: 25px;">
                <label for="manual-select">أو اختاري أكلة يدوياً:</label>
                <select id="manual-select" onchange="getManualRecipe()">
                    <option value="">-- اختاري من القائمة --</option>
                </select>
            </div>

            <div id="recipe-result" class="result-box" style="display: none;">
                <h3 id="recipe-title" style="margin-top:0; color: var(--secondary-color);"></h3>
                <p><strong>المكونات المطلوبة:</strong></p>
                <ul id="recipe-ingredients-list"></ul>
                
                <button class="btn btn-whatsapp" onclick="shareOnWhatsApp()">📲 إرسال المكونات عبر الواتساب</button>
            </div>
        </div>

        <!-- 2. صفحة الأكلات المسجلة -->
        <div id="page-display" class="page">
            <h2>قائمة الأكلات المسجلة</h2>
            <ul id="all-recipes-list" class="item-list"></ul>
        </div>

        <!-- 3. صفحة إضافة وتعديل أكلة -->
        <div id="page-add" class="page">
            <h2 id="form-title">إضافة أكلة جديدة</h2>

            <details class="ai-config">
                <summary style="cursor:pointer; font-weight:bold; color:var(--ai-color);">⚙️ إعدادات الذكاء الاصطناعي Gemini (اختياري)</summary>
                <p style="margin:5px 0;">ضع مفتاح Gemini API لجلب المكونات تلقائياً عند البحث:</p>
                <input type="password" id="gemini-api-key" placeholder="أدخل Gemini API Key هنا" onchange="saveApiKey()">
            </details>

            <label>اسم الأكلة:</label>
            <input type="text" id="new-recipe-name" placeholder="مثلاً: مقلوبة">

            <button type="button" class="btn btn-ai" onclick="fetchIngredientsWithAI()">✨ جلب المكونات بالذكاء الاصطناعي (Gemini)</button>

            <label style="margin-top:15px; display:block;">المكونات (ضع كل مكون في سطر):</label>
            <textarea id="new-recipe-ingredients" rows="6" placeholder="مثال:&#10;1 ملعقة كبيرة توابل&#10;كيلو شيش طاووق&#10;كأس أرز طويل&#10;2 حبة باذنجان"></textarea>

            <button class="btn" id="save-recipe-btn" onclick="addOrUpdateRecipe()">حفظ الأكلة في القائمة</button>
            <button class="btn" id="cancel-edit-btn" style="background-color: #7f8c8d; display: none;" onclick="cancelEdit()">إلغاء التعديل</button>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <div class="modal-overlay" id="custom-modal">
        <div class="modal-card">
            <p id="modal-msg"></p>
            <div class="modal-buttons">
                <button class="btn" id="modal-confirm-btn">تأكيد</button>
                <button class="btn" style="background-color: #7f8c8d;" id="modal-cancel-btn">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://cook-book-6d572-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.recipesData = {};
        let editingRecipeId = null;
        let originalName = "";
        let originalIngredients = "";
        let currentRecipe = null;

        // --- مراقبة التغييرات لزر التعديل ---
        function checkEditChanges() {
            if (!editingRecipeId) return;

            const currentName = document.getElementById('new-recipe-name').value.trim();
            const currentIngredients = document.getElementById('new-recipe-ingredients').value.trim();
            const saveBtn = document.getElementById('save-recipe-btn');

            // تفعيل الزر فقط إذا تغير الاسم أو المكونات عن القيمة الأصلية
            const isChanged = (currentName !== originalName) || (currentIngredients !== originalIngredients);
            saveBtn.disabled = !isChanged;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_key');
            if (savedKey) {
                document.getElementById('gemini-api-key').value = savedKey;
            }

            // الاستماع لتغييرات المدخلات
            document.getElementById('new-recipe-name').addEventListener('input', checkEditChanges);
            document.getElementById('new-recipe-ingredients').addEventListener('input', checkEditChanges);
        });

        window.showToast = function(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.showConfirmModal = function(message, onConfirm) {
            const modal = document.getElementById('custom-modal');
            const msgEl = document.getElementById('modal-msg');
            const confirmBtn = document.getElementById('modal-confirm-btn');
            const cancelBtn = document.getElementById('modal-cancel-btn');

            msgEl.textContent = message;
            modal.classList.add('active');

            const cleanup = () => {
                modal.classList.remove('active');
                confirmBtn.onclick = null;
                cancelBtn.onclick = null;
            };

            confirmBtn.onclick = () => {
                cleanup();
                onConfirm();
            };

            cancelBtn.onclick = cleanup;
        }

        window.saveApiKey = function() {
            const key = document.getElementById('gemini-api-key').value.trim();
            localStorage.setItem('gemini_key', key);
            showToast("تم حفظ مفتاح API بنجاح");
        }

        window.switchPage = function(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`page-${pageName}`).classList.add('active');
            document.getElementById(`tab-${pageName}`).classList.add('active');
        }

        function cleanIngredientLine(line) {
            if (!line) return "";
            let cleaned = line;
            cleaned = cleaned.replace(/[0-9٠-٩½⅓¼⅕⅙⅛⅔⅖¾⅗⅜⅘⅝⅞/]/g, ' ');

            const wordsToRemove = [
                "كيلو جرام", "كيلوجرام", "كيلو", "جرام", "غرام", "مل", "مليلتر", "لتر",
                "ملعقة كبيرة", "ملعقة صغيرة", "ملعقة طعام", "ملعقة شاي", "ملعقة", "ملاعق",
                "كوب", "أكواب", "كأس", "كؤوس", "فنجان", "فناجين", "بيالة", "صحن", "زبدية", "طاسة",
                "حبة", "حبات", "قطعة", "قطع", "رأس", "رؤوس", "فص", "فصوص", "عود", "أعواد",
                "شريحة", "شرائح", "ورقة", "أوراق", "ظرف", "أظرف", "علبة", "علب", "كيس", "أكياس", "عبوة", "ربطة", "حزمة", "رشة",
                "نصف", "ربع", "ثلث", "ثمن", "واحدة", "واحد", "اثنان", "ثلاثة", "أربعة", "خمسة",
                "كبيرة", "صغيرة", "وسط", "متوسطة", "مطحون", "مطحونة", "مفروم", "مفرومة", "مقطع", "مقطعة",
                "شرائح", "ناعمة", "ناعم", "خشن", "خشنة", "مجفف", "مجففة", "معلب", "طازج", "طازجة",
                "حسب الرغبة", "للتزيين", "للدهن", "لقلي", "للقلي", "حسب الحاجة", "دبوس"
            ];

            wordsToRemove.forEach(word => {
                const reg = new RegExp('\\b' + word + '\\b|' + word, 'gi');
                cleaned = cleaned.replace(reg, '');
            });

            cleaned = cleaned.replace(/[()\-–—،,.:;*•]/g, ' ').trim();
            cleaned = cleaned.replace(/\s+/g, ' ');
            return cleaned;
        }

        window.fetchIngredientsWithAI = async function() {
            const mealName = document.getElementById('new-recipe-name').value.trim();
            const apiKey = document.getElementById('gemini-api-key').value.trim();

            if (!mealName) {
                showToast("يرجى كتابة اسم الأكلة أولاً!");
                return;
            }
            if (!apiKey) {
                showToast("يرجى إدخال مفتاح Gemini API في الإعدادات أعلاه.");
                return;
            }

            const aiBtn = document.querySelector('.btn-ai');
            aiBtn.textContent = "⏳ جاري جلب المكونات...";
            aiBtn.disabled = true;

            try {
                const prompt = `اعطني قائمة بالمكونات الأساسية للطبخة التالية: "${mealName}". قم بإرجاع المكونات فقط بدون مقادير أو أرقام أو كلمات قياس، كل مكون في سطر منفصل وبدون أي مقدمة أو خاتمة.`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    document.getElementById('new-recipe-ingredients').value = data.candidates[0].content.parts[0].text.trim();
                    checkEditChanges(); // إشعار تغيير المكونات بعد جلب الذكاء الاصطناعي
                    showToast("تم جلب المكونات بنجاح ✨");
                } else {
                    showToast("تعذر جلب المكونات، تأكد من المفتاح.");
                }
            } catch (err) {
                showToast("حدث خطأ أثناء الاتصال بالذكاء الاصطناعي.");
            } finally {
                aiBtn.textContent = "✨ جلب المكونات بالذكاء الاصطناعي (Gemini)";
                aiBtn.disabled = false;
            }
        }

        const recipesRef = ref(db, 'recipes');

        onValue(recipesRef, (snapshot) => {
            const data = snapshot.val() || {};
            window.recipesData = data;
            
            const selectEl = document.getElementById('manual-select');
            const listEl = document.getElementById('all-recipes-list');
            
            selectEl.innerHTML = '<option value="">-- اختاري من القائمة --</option>';
            listEl.innerHTML = '';

            for (let id in data) {
                let opt = document.createElement('option');
                opt.value = id;
                opt.textContent = data[id].name;
                selectEl.appendChild(opt);

                let li = document.createElement('li');
                li.innerHTML = `
                    <div>
                        <strong>${data[id].name}</strong>
                        <div style="font-size:0.9rem; color:#666; margin-top:4px;">${data[id].ingredients.join(' • ')}</div>
                    </div>
                    <div class="action-btns">
                        <button style="background:var(--edit-color); color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;" onclick="editRecipe('${id}')">تعديل</button>
                        <button style="background:var(--danger-color); color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;" onclick="deleteRecipe('${id}')">حذف</button>
                    </div>
                `;
                listEl.appendChild(li);
            }
        });

        // --- بدء التعديل وتجميد زر الحفظ حتى حدوث تغيير ---
        window.editRecipe = function(id) {
            const recipe = window.recipesData[id];
            if (!recipe) return;

            editingRecipeId = id;
            originalName = recipe.name.trim();
            originalIngredients = recipe.ingredients.join('\n').trim();

            document.getElementById('form-title').textContent = `تعديل أكلة: (${recipe.name})`;
            document.getElementById('new-recipe-name').value = originalName;
            document.getElementById('new-recipe-ingredients').value = originalIngredients;
            
            const saveBtn = document.getElementById('save-recipe-btn');
            saveBtn.textContent = "تحديث البيانات";
            saveBtn.disabled = true; // الزر معطل حتى يحدث تغيير

            document.getElementById('cancel-edit-btn').style.display = "block";

            switchPage('add');
        }

        // --- إلغاء التعديل إعادة ضبط النموذج ---
        window.cancelEdit = function() {
            editingRecipeId = null;
            originalName = "";
            originalIngredients = "";

            document.getElementById('form-title').textContent = "إضافة أكلة جديدة";
            document.getElementById('new-recipe-name').value = '';
            document.getElementById('new-recipe-ingredients').value = '';
            
            const saveBtn = document.getElementById('save-recipe-btn');
            saveBtn.textContent = "حفظ الأكلة في القائمة";
            saveBtn.disabled = false;

            document.getElementById('cancel-edit-btn').style.display = "none";

            showToast("تم إلغاء التعديل ولم يتم حفظ أي تغييرات ℹ️");
        }

        // --- الحفظ / التحديث ---
        window.addOrUpdateRecipe = function() {
            const name = document.getElementById('new-recipe-name').value.trim();
            const rawIngredientsText = document.getElementById('new-recipe-ingredients').value;

            if (!name || !rawIngredientsText.trim()) {
                showToast("يرجى إدخال اسم الأكلة والمكونات.");
                return;
            }

            const isEdit = Boolean(editingRecipeId);
            const confirmMsg = isEdit 
                ? `هل أنت تأكد من حفظ التعديلات الجديدة على أكلة (${name})؟` 
                : `هل أنت تأكد من إضافة أكلة (${name}) إلى القائمة؟`;

            showConfirmModal(confirmMsg, () => {
                const lines = rawIngredientsText.split('\n');
                const cleanedIngredients = [];

                lines.forEach(line => {
                    const cleaned = cleanIngredientLine(line);
                    if (cleaned.length > 1) {
                        cleanedIngredients.push(cleaned);
                    }
                });

                if (cleanedIngredients.length === 0) {
                    showToast("لم يتم العثور على مكونات صالحة بعد التنظيف.");
                    return;
                }

                if (isEdit) {
                    set(ref(db, `recipes/${editingRecipeId}`), {
                        name: name,
                        ingredients: cleanedIngredients
                    }).then(() => {
                        showToast("تم تحديث البيانات بنجاح! ✅");
                        window.cancelEdit();
                        switchPage('display');
                    });
                } else {
                    const newRecipeRef = push(recipesRef);
                    set(newRecipeRef, {
                        name: name,
                        ingredients: cleanedIngredients
                    }).then(() => {
                        document.getElementById('new-recipe-name').value = '';
                        document.getElementById('new-recipe-ingredients').value = '';
                        showToast("تم حفظ الأكلة بنجاح! 🎉");
                        switchPage('display');
                    });
                }
            });
        }

        // --- الحذف ---
        window.deleteRecipe = function(id) {
            const recipe = window.recipesData[id];
            const recipeName = recipe ? recipe.name : "";

            showConfirmModal(`⚠️ هل أنت متأكد حقاً من حذف أكلة (${recipeName})؟`, () => {
                remove(ref(db, `recipes/${id}`));
                showToast("تم حذف الأكلة بنجاح.");
                if (editingRecipeId === id) {
                    window.cancelEdit();
                }
            });
        }

        // --- عرض وإقتراح الأكلات ---
        window.getRandomRecipe = function() {
            const keys = Object.keys(window.recipesData);
            if (keys.length === 0) {
                showToast("لا توجد أكلات مسجلة حالياً.");
                return;
            }
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            displayRecipe(window.recipesData[randomKey]);
        }

        window.getManualRecipe = function() {
            const selectedId = document.getElementById('manual-select').value;
            if (selectedId && window.recipesData[selectedId]) {
                displayRecipe(window.recipesData[selectedId]);
            }
        }

        function displayRecipe(recipe) {
            currentRecipe = recipe;
            document.getElementById('recipe-title').textContent = recipe.name;
            const listEl = document.getElementById('recipe-ingredients-list');
            listEl.innerHTML = '';
            
            recipe.ingredients.forEach(ing => {
                let li = document.createElement('li');
                li.textContent = ing;
                listEl.appendChild(li);
            });

            document.getElementById('recipe-result').style.display = 'block';
        }

        // --- مشاركة المكونات عبر الواتساب ---
        window.shareOnWhatsApp = function() {
            if (!currentRecipe) return;

            let message = `🛒 *المكونات المطلوبة لطبخة (${currentRecipe.name}):*\n\n`;
            currentRecipe.ingredients.forEach(ing => {
                message += `• ${ing}\n`;
            });

            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
