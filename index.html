<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>مطبخنا 🍲</title>
<style>
  :root{
    --bg:#1C140F; --surface:#2A1F17; --surface-2:#332619;
    --accent:#FF9F55; --accent2:#8FBF5C; --danger:#E8695A;
    --text:#FBF3EA; --text-dim:#C9B8A8; --border:rgba(251,243,234,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(255,159,85,0.08), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(143,191,92,0.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Segoe UI Arabic","Noto Sans Arabic",Tahoma,Arial,sans-serif;
    min-height:100%; min-height:100dvh; display:flex; justify-content:center; -webkit-user-select:none; user-select:none;
  }
  #app{ width:100%; max-width:560px; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; position:relative;}
  .screen{
    display:none; flex-direction:column; flex:1; animation:fadeIn .3s ease;
    padding:22px 20px calc(20px + env(safe-area-inset-bottom, 0px) + 64px);
  }
  .screen.active{display:flex;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  h1{font-size:24px; font-weight:800; margin:0 0 6px;}
  p.sub{color:var(--text-dim); font-size:14.5px; line-height:1.7; margin:0 0 16px;}
  .eyebrow{color:var(--text-dim); font-size:12.5px; margin:0 0 8px; display:flex; align-items:center; justify-content:space-between;}
  .spacer{height:22px;}
  .big-emoji{font-size:48px; margin-bottom:8px;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px;}
  label{display:block; font-size:13px; color:var(--text-dim); margin:0 0 6px;}
  input[type=text], textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    color:var(--text); font-family:inherit; font-size:15.5px; padding:12px 14px; margin-bottom:10px; resize:vertical;
  }
  input[type=text]:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}

  button.btn{appearance:none; border:none; border-radius:14px; padding:15px 18px; font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; touch-action:manipulation; width:100%;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#d97f3a); color:#2a1400; box-shadow:0 6px 18px rgba(255,159,85,0.22);}
  .btn-green{background:linear-gradient(135deg,var(--accent2),#6fa03f); color:#12240a;}
  .btn-ghost{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn-row{display:flex; gap:10px; margin-top:10px;}
  .btn-row > button{flex:1;}

  .home-actions{display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
  .action-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; cursor:pointer; text-align:center;}
  .action-card .emoji{font-size:32px; margin-bottom:6px;}
  .action-card h3{margin:0; font-size:17px;}
  .manage-link{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 8px; text-align:center; font-size:14px; cursor:pointer;}

  .list-row{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer;}
  .list-row .name{font-size:15px; font-weight:600;}
  .list-row .meta{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .row-actions{display:flex; gap:6px;}
  .icon-btn{width:32px; height:32px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; flex-shrink:0;}
  .icon-btn.danger{color:var(--danger); border-color:rgba(232,105,90,0.4);}

  .dish-name{font-size:26px; font-weight:800; text-align:center; margin:6px 0 14px;}
  .check-hint{font-size:13px; color:var(--text-dim); text-align:center; margin-bottom:12px;}
  .check-row{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 14px; margin-bottom:7px; cursor:pointer;}
  .check-box{width:24px; height:24px; border-radius:7px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; color:transparent;}
  .check-box.checked{background:var(--accent2); border-color:var(--accent2); color:#12240a;}
  .check-label{font-size:15px;}
  .check-row.off .check-label{color:var(--text-dim); text-decoration:line-through;}

  .empty-hint{color:var(--text-dim); font-size:14px; text-align:center; padding:24px 10px;}
  a.link-btn{color:var(--accent); font-size:14px; cursor:pointer;}
  .toast{position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:10px 18px; border-radius:20px; font-size:13.5px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60; max-width:90%; text-align:center;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="big-emoji" style="text-align:center;">🍲</div>
    <h1 style="text-align:center;">مطبخنا</h1>
    <p class="sub" style="text-align:center;">ماذا نطبخ اليوم؟</p>
    <div class="home-actions">
      <div class="action-card" id="card-random">
        <div class="emoji">🎲</div>
        <h3>اختيار عشوائي</h3>
      </div>
      <div class="action-card" id="card-manual">
        <div class="emoji">📋</div>
        <h3>اختيار يدوي من القائمة</h3>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="manage-link" id="link-manage-dishes">🍽️ إدارة الأكلات (إضافة / تعديل / حذف)</div>
  </div>

  <!-- MANUAL LIST -->
  <div class="screen" id="screen-manual-list">
    <div class="eyebrow"><span>اختر أكلة</span><span id="manual-back" style="cursor:pointer;">✕ إغلاق</span></div>
    <h1 style="font-size:20px;">القائمة</h1>
    <div id="manual-list-body" style="flex:1; overflow:auto;"></div>
  </div>

  <!-- DISH DETAIL -->
  <div class="screen" id="screen-dish-detail">
    <div class="eyebrow"><span id="detail-back" style="cursor:pointer;">⬅ رجوع</span></div>
    <div class="dish-name" id="detail-name"></div>
    <p class="check-hint">كل المكوّنات محددة افتراضياً. ألغِ تحديد ما هو متوفر لديك، والباقي هو قائمة التسوّق.</p>
    <div id="detail-ingredients" style="flex:1; overflow:auto;"></div>
    <button class="btn btn-green" id="detail-whatsapp">📲 إرسال قائمة الشراء عبر واتساب</button>
    <div class="btn-row">
      <button class="btn btn-ghost" id="detail-reroll" style="display:none;">🔄 أكلة أخرى</button>
      <button class="btn btn-primary" id="detail-home">🏠 الرئيسية</button>
    </div>
  </div>

  <!-- MANAGE DISHES LIST -->
  <div class="screen" id="screen-manage-dishes">
    <div class="eyebrow"><span>إدارة الأكلات</span><span id="dishes-back" style="cursor:pointer;">✕ إغلاق</span></div>
    <h1 style="font-size:20px;">قائمة الأكلات</h1>
    <div id="dishes-list-body" style="flex:1; overflow:auto;"></div>
    <button class="btn btn-primary" id="add-dish-btn" style="margin-top:10px;">➕ أضف أكلة جديدة</button>
  </div>

  <!-- DISH FORM (add/edit) -->
  <div class="screen" id="screen-dish-form">
    <div class="eyebrow"><span id="form-title-eyebrow">أكلة جديدة</span><span id="form-cancel" style="cursor:pointer;">✕ إلغاء</span></div>
    <div class="card">
      <label>اسم الأكلة</label>
      <input type="text" id="dish-name-input" placeholder="مثال: مقلوبة" maxlength="30">
      <label>الصق المكوّنات هنا (بالمقادير أو بدونها — سيتم تنظيفها تلقائياً، كل مكوّن بسطر)</label>
      <textarea id="dish-ing-textarea" rows="8" placeholder="مثال:&#10;٢ كوب أرز طويل&#10;نصف كيلو باذنجان&#10;ملعقة كبيرة توابل&#10;كأس زيت"></textarea>
    </div>
    <p class="sub" id="form-preview-hint" style="display:none;"></p>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="save-dish-btn">💾 حفظ الأكلة</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  "use strict";

  // ======== Firebase Realtime Database (REST, no SDK) ========
  var DB_URL = 'https://cook-book-6d572-default-rtdb.europe-west1.firebasedatabase.app';
  var ROOT = 'meals2';

  function fbPath(){
    return Array.prototype.slice.call(arguments).map(function(s){ return encodeURIComponent(String(s)); }).join('/');
  }
  async function fbGet(path){
    try{
      var res = await fetch(DB_URL + '/' + path + '.json');
      if (!res.ok) return null;
      return await res.json();
    }catch(e){ console.error('fbGet failed', path, e); return null; }
  }
  async function fbSet(path, value){
    try{
      var res = await fetch(DB_URL + '/' + path + '.json', {
        method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(value)
      });
      return res.ok;
    }catch(e){ console.error('fbSet failed', path, e); return false; }
  }
  function genId(){ return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  // ---------- ingredient line cleaner (no AI, pure text rules) ----------
  var UNIT_WORDS = [
    'كيلو جرام','كيلوجرام','كيلو غرام','كيلو','جرام','غرام','مل','ملليلتر','مليلتر','لتر',
    'ملعقة كبيرة','ملعقة صغيرة','ملعقة طعام','ملعقة شاي','ملعقة','ملاعق كبيرة','ملاعق صغيرة','ملاعق',
    'كوب','أكواب','كأس','كؤوس','فنجان','فناجين','بيالة','صحن','زبدية','طاسة',
    'حبة','حبات','حبّة','قطعة','قطع','رأس','رؤوس','فص','فصوص','عود','أعواد',
    'شريحة','شرائح','ورقة','أوراق','ظرف','أظرف','علبة','علب','كيس','أكياس','عبوة','عبوات','ربطة','حزمة','رشة','رشات',
    'نصف','ربع','ثلث','ثمن',
    'كبيرة','صغيرة','متوسطة','وسط',
    'مطحون','مطحونة','مفروم','مفرومة','مقطع','مقطعة','مبشور','مبشورة',
    'ناعم','ناعمة','خشن','خشنة','مجفف','مجففة','معلب','معلبة','طازج','طازجة',
    'حسب الرغبة','حسب الحاجة','للتزيين','للدهن','للقلي','لقلي'
  ];
  function cleanIngredientLine(line){
    if (!line) return '';
    var s = line;
    s = s.replace(/[0-9٠-٩½⅓¼⅕⅙⅛⅔⅖¾⅗⅜⅘⅝⅞/.]/g, ' ');
    UNIT_WORDS.forEach(function(w){
      var re = new RegExp('(^|\\s)'+w+'(?=\\s|$)','gi');
      s = s.replace(re, ' ');
    });
    s = s.replace(/[()\-–—،,:;*•]/g, ' ');
    s = s.replace(/\s+/g, ' ').trim();
    return s;
  }
  function cleanRecipeText(text){
    var lines = (text||'').split('\n');
    var out = [];
    lines.forEach(function(l){
      var c = cleanIngredientLine(l);
      if (c.length > 1) out.push(c);
    });
    return out;
  }

  var screens = {};
  document.querySelectorAll('.screen').forEach(function(el){ screens[el.id]=el; });
  function show(id){
    Object.keys(screens).forEach(function(k){ screens[k].classList.toggle('active', k===id); });
    window.scrollTo(0,0);
  }
  var toastEl = document.getElementById('toast');
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var dishesCache = {};
  var editingDishId = null;
  var cameFromRandom = false;
  var detailChecked = [];

  async function loadDishes(){
    dishesCache = (await fbGet(fbPath(ROOT,'dishes'))) || {};
    return dishesCache;
  }

  // ---------- HOME ----------
  document.getElementById('card-random').addEventListener('click', async function(){
    await loadDishes();
    var ids = Object.keys(dishesCache);
    if (!ids.length){ toast('أضيفي أكلات أولاً من "إدارة الأكلات"'); return; }
    var id = ids[Math.floor(Math.random()*ids.length)];
    cameFromRandom = true;
    await showDishDetail(id);
  });

  document.getElementById('card-manual').addEventListener('click', async function(){
    await renderManualList();
    show('screen-manual-list');
  });
  document.getElementById('manual-back').addEventListener('click', function(){ show('screen-home'); });

  document.getElementById('link-manage-dishes').addEventListener('click', async function(){
    await renderDishesManager();
    show('screen-manage-dishes');
  });
  document.getElementById('dishes-back').addEventListener('click', function(){ show('screen-home'); });

  // ---------- MANUAL LIST ----------
  async function renderManualList(){
    await loadDishes();
    var body = document.getElementById('manual-list-body');
    var ids = Object.keys(dishesCache);
    if (!ids.length){
      body.innerHTML = '<div class="empty-hint">لا توجد أكلات مضافة بعد.</div>';
      return;
    }
    body.innerHTML = '';
    ids.forEach(function(id){
      var row = document.createElement('div');
      row.className = 'list-row';
      row.innerHTML = '<div class="name">🍽️ '+escapeHtml(dishesCache[id].name)+'</div><div>›</div>';
      row.addEventListener('click', async function(){
        cameFromRandom = false;
        await showDishDetail(id);
      });
      body.appendChild(row);
    });
  }

  // ---------- DISH DETAIL (shopping checklist) ----------
  async function showDishDetail(id){
    var dish = dishesCache[id] || (await fbGet(fbPath(ROOT,'dishes',id)));
    if (!dish){ toast('تعذر إيجاد الأكلة'); return; }

    document.getElementById('detail-name').textContent = dish.name;
    var ings = dish.ingredients || [];
    detailChecked = ings.map(function(){ return true; });

    var wrap = document.getElementById('detail-ingredients');
    function renderRows(){
      wrap.innerHTML = '';
      if (!ings.length){
        wrap.innerHTML = '<div class="empty-hint">لم تُحدَّد مكوّنات لهذه الأكلة بعد.</div>';
        return;
      }
      ings.forEach(function(name, idx){
        var row = document.createElement('div');
        row.className = 'check-row' + (detailChecked[idx] ? '' : ' off');
        row.innerHTML = '<div class="check-box'+(detailChecked[idx]?' checked':'')+'">✓</div><div class="check-label">'+escapeHtml(name)+'</div>';
        row.addEventListener('click', function(){
          detailChecked[idx] = !detailChecked[idx];
          renderRows();
        });
        wrap.appendChild(row);
      });
    }
    renderRows();

    document.getElementById('detail-reroll').style.display = cameFromRandom ? 'block' : 'none';
    document.getElementById('detail-whatsapp').onclick = function(){
      var needed = ings.filter(function(n, idx){ return detailChecked[idx]; });
      if (!needed.length){ toast('اختاري مكوّناً واحداً على الأقل'); return; }
      var msg = '🛒 قائمة تسوّق لطبخة (' + dish.name + '):\n\n' + needed.map(function(n){ return '• '+n; }).join('\n');
      window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(msg), '_blank');
    };
    document.getElementById('detail-reroll').onclick = async function(){
      var ids = Object.keys(dishesCache).filter(function(k){ return k !== id; });
      if (!ids.length) ids = Object.keys(dishesCache);
      var next = ids[Math.floor(Math.random()*ids.length)];
      await showDishDetail(next);
    };
    show('screen-dish-detail');
  }
  document.getElementById('detail-back').addEventListener('click', function(){
    show(cameFromRandom ? 'screen-home' : 'screen-manual-list');
  });
  document.getElementById('detail-home').addEventListener('click', function(){ show('screen-home'); });

  // ---------- MANAGE DISHES ----------
  async function renderDishesManager(){
    await loadDishes();
    var body = document.getElementById('dishes-list-body');
    var ids = Object.keys(dishesCache);
    if (!ids.length){
      body.innerHTML = '<div class="empty-hint">لا توجد أكلات مضافة بعد.</div>';
      return;
    }
    body.innerHTML = '';
    ids.forEach(function(id){
      var dish = dishesCache[id];
      var count = (dish.ingredients||[]).length;
      var row = document.createElement('div');
      row.className = 'list-row';
      row.innerHTML = '<div><div class="name">🍽️ '+escapeHtml(dish.name)+'</div><div class="meta">'+count+' مكوّن</div></div>';
      var actions = document.createElement('div');
      actions.className = 'row-actions';
      var editBtn = document.createElement('div');
      editBtn.className = 'icon-btn';
      editBtn.textContent = '✏️';
      editBtn.addEventListener('click', function(e){ e.stopPropagation(); openDishForm(id); });
      var delBtn = document.createElement('div');
      delBtn.className = 'icon-btn danger';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', async function(e){
        e.stopPropagation();
        if (!confirm('حذف أكلة "'+dish.name+'"؟')) return;
        await fbSet(fbPath(ROOT,'dishes',id), null);
        renderDishesManager();
      });
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      row.appendChild(actions);
      body.appendChild(row);
    });
  }

  document.getElementById('add-dish-btn').addEventListener('click', function(){ openDishForm(null); });

  function openDishForm(id){
    editingDishId = id;
    var nameInput = document.getElementById('dish-name-input');
    var textarea = document.getElementById('dish-ing-textarea');
    var previewHint = document.getElementById('form-preview-hint');
    previewHint.style.display = 'none';

    if (id){
      var dish = dishesCache[id];
      document.getElementById('form-title-eyebrow').textContent = 'تعديل: ' + dish.name;
      nameInput.value = dish.name;
      textarea.value = (dish.ingredients||[]).join('\n');
    } else {
      document.getElementById('form-title-eyebrow').textContent = 'أكلة جديدة';
      nameInput.value = '';
      textarea.value = '';
    }
    show('screen-dish-form');
  }

  document.getElementById('form-cancel').addEventListener('click', async function(){
    await renderDishesManager();
    show('screen-manage-dishes');
  });

  document.getElementById('save-dish-btn').addEventListener('click', async function(){
    var name = document.getElementById('dish-name-input').value.trim();
    var rawText = document.getElementById('dish-ing-textarea').value;
    if (!name){ toast('اكتبي اسم الأكلة أولاً'); return; }
    var cleaned = cleanRecipeText(rawText);
    if (!cleaned.length){ toast('لم يتم العثور على مكوّنات صالحة في النص'); return; }

    var id = editingDishId || genId();
    await fbSet(fbPath(ROOT,'dishes',id), {name:name, ingredients:cleaned});
    toast('تم الحفظ ✅ ('+cleaned.length+' مكوّن)');
    await renderDishesManager();
    show('screen-manage-dishes');
  });

})();
</script>
</body>
</html>
